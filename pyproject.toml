[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caye-watermark"
version = "0.1.0"
description = "Optimize photos and generate watermarked exports with Python."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0.0",
  "Pillow>=10.0.0",
  "rawpy>=0.20.0",
  "gradio>=4.0.0",
]

[project.scripts]
caye-watermark = "caye_watermark.cli:main"
caye-watermark-web = "caye_watermark.webui:launch_app"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
caye_watermark = ["assets/brands/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
norecursedirs = [".git", ".pytest_cache", "__pycache__", "build", "dist", "pytest-cache-files-*"]
